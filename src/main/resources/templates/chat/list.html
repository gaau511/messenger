<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8">
  <title>채팅방 목록</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-6">
<div class="max-w-4xl mx-auto bg-white rounded-2xl shadow-md p-6">
  <h1 class="text-2xl font-bold mb-4">채팅방 목록</h1>

  <a th:href="@{/view/chats/create}"
     class="inline-block mb-6 px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-blue-600 transition">
    채팅방 생성하기
  </a>

  <div class="divide-y divide-gray-200">
    <div th:each="room : ${chatRooms}" class="py-4">
      <a th:href="@{/view/chats/{chatRoomId}/{memberId}(chatRoomId=${room.chatRoomInfo.id}, memberId=${memberId})}" class="flex items-center hover:bg-gray-50 p-4 rounded-lg transition">
        <!-- 채팅방 정보 -->
        <div class="flex-1">
          <div class="flex justify-between items-center">
            <!-- 채팅방 이름 -->
            <h2 class="text-lg font-semibold text-gray-800" th:text="${room.chatRoomInfo.title}">채팅방 이름</h2>
            <!-- 마지막 메시지 시간 (null 체크) -->
            <span class="text-sm text-gray-500"
                  th:text="${room.lastMessage != null ? #temporals.format(room.lastMessage.createdAt, 'yyyy-MM-dd HH:mm') : '-'}">시간</span>
          </div>
          <!-- 마지막 메시지 미리보기 (null 체크) -->
          <p class="text-sm text-gray-600 truncate mt-1"
             th:text="${room.lastMessage != null ? room.lastMessage.contents : 'No Message'}">마지막 메시지 미리보기</p>
        </div>
      </a>
    </div>
  </div>
</body>
</html>
